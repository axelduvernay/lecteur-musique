<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Musique</title>
  <meta name="theme-color" content="#F5EFE7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Musique">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icone-192.png" type="image/png">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icone-180.png">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="appli">

<div id="app" class="app" data-etat="attente" data-lecture="arret">

  <header class="haut">
    <h1 class="salut">
      <span id="salut-lu" class="sr"></span>
      <span id="salut-place" class="salut-place" aria-hidden="true"></span>
      <span id="salut-frappe" class="salut-frappe" aria-hidden="true"></span>
    </h1>
    <button id="btn-dossier" type="button" class="capsule contour">
      <svg viewBox="0 0 24 24" class="trait" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>
      <span id="btn-dossier-texte">Définir le dossier</span>
    </button>
  </header>

  <div class="corps">

    <nav id="vues" class="vues glissiere" aria-label="Bibliothèque">
      <span class="curseur" aria-hidden="true"></span>
      <button type="button" data-vue="favoris" aria-pressed="false">
        <svg viewBox="0 0 24 24" class="trait" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.2 3.4 5 6.6 5c2 0 3.5 1.1 5.4 3.2C13.9 6.1 15.4 5 17.4 5c3.2 0 5.1 3.2 3.9 6.3-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
        <span class="vue-nom">Favoris</span>
        <span id="n-favoris" class="vue-nombre">0</span>
      </button>
      <button type="button" data-vue="tout" aria-pressed="true">
        <svg viewBox="0 0 24 24" class="trait" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
        <span class="vue-nom">Tout</span>
        <span id="n-tout" class="vue-nombre">0</span>
      </button>
    </nav>

    <main class="bibliotheque">

      <div class="tete">
        <div id="tete-textes" class="tete-textes">
          <h2 id="vue-titre">Tous les morceaux</h2>
          <p id="vue-compte"></p>
        </div>
        <button id="btn-aleatoire" type="button" class="capsule plein">
          <svg viewBox="0 0 24 24" class="trait" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
          <span>Lecture aléatoire</span>
        </button>
      </div>

      <div class="outils">
        <label class="recherche">
          <svg viewBox="0 0 24 24" class="trait" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="recherche" type="search" placeholder="Rechercher" aria-label="Rechercher un titre ou un artiste" autocomplete="off" spellcheck="false">
        </label>
        <div id="tri" class="tri glissiere" role="group" aria-label="Trier par">
          <span class="curseur" aria-hidden="true"></span>
          <button type="button" data-tri="titre" aria-pressed="true">Titre</button>
          <button type="button" data-tri="artiste" aria-pressed="false">Artiste</button>
        </div>
      </div>

      <div class="cadre">
        <div id="defilant" class="defilant">
          <ul id="liste"></ul>
          <p id="liste-vide" class="liste-vide" hidden></p>
          <div id="sentinelle"></div>
        </div>
      </div>

      <!-- Chargement -->
      <div class="squelette" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <!-- Premier lancement, permission à redonner, dossier vide -->
      <section id="accueil" class="accueil">
        <div class="accueil-disque" aria-hidden="true"><i></i></div>
        <h2 id="accueil-titre"></h2>
        <p id="accueil-texte"></p>
        <button id="accueil-action" type="button" class="capsule plein grand"></button>
      </section>

    </main>

    <section id="lecteur" class="lecteur" aria-label="En cours de lecture">

      <div class="platine" aria-hidden="true">
        <div id="disque" class="disque"><div class="etiquette"></div></div>
        <div class="reflet"></div>
      </div>

      <div id="infos" class="infos" aria-live="polite">
        <p id="titre" class="titre"></p>
        <p id="artiste" class="artiste"></p>
      </div>

      <div class="progression">
        <div id="barre" class="barre" role="slider" tabindex="0" aria-label="Position dans le morceau" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="barre-fond"><div id="barre-pleine" class="barre-pleine"></div></div>
        </div>
        <div class="temps"><span id="t-ecoule">0:00</span><span id="t-reste"></span></div>
      </div>

      <div class="commandes">
        <button id="btn-melange" type="button" class="rond petit melange" aria-label="Lecture aléatoire" aria-pressed="true">
          <svg viewBox="0 0 24 24" class="trait" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button id="btn-precedent" type="button" class="rond saut" aria-label="Morceau précédent">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 19.2 9.6 12.9a1.1 1.1 0 0 1 0-1.8l8.9-6.3A.9.9 0 0 1 20 5.5v13a.9.9 0 0 1-1.5.7z"/><rect x="4" y="5" width="2.6" height="14" rx="1.1"/></svg>
        </button>
        <button id="btn-lecture" type="button" class="rond jouer" aria-label="Lecture">
          <svg viewBox="0 0 24 24" class="i-pause" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.1"/></svg>
          <svg viewBox="0 0 24 24" class="i-lecture" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </button>
        <button id="btn-suivant" type="button" class="rond saut" aria-label="Morceau suivant">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 19.2l8.9-6.3a1.1 1.1 0 0 0 0-1.8L5.5 4.8A.9.9 0 0 0 4 5.5v13a.9.9 0 0 0 1.5.7z"/><rect x="17.4" y="5" width="2.6" height="14" rx="1.1"/></svg>
        </button>
        <button id="btn-favori" type="button" class="rond petit coeur" aria-label="Ajouter aux favoris" aria-pressed="false">
          <svg viewBox="0 0 24 24" class="trait" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.2 3.4 5 6.6 5c2 0 3.5 1.1 5.4 3.2C13.9 6.1 15.4 5 17.4 5c3.2 0 5.1 3.2 3.9 6.3-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
        </button>
      </div>

      <label id="zone-volume" class="volume">
        <svg viewBox="0 0 24 24" class="trait" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/></svg>
        <span class="sr">Volume</span>
        <input id="volume" type="range" min="0" max="100" step="1" value="80">
        <svg viewBox="0 0 24 24" class="trait" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </label>

      <p id="ensuite" class="ensuite"></p>

    </section>
  </div>
</div>

<p id="avancement" class="avancement" role="status" hidden></p>
<input id="import" type="file" multiple accept="audio/*,.mp3,.m4a,.aac,.wav" hidden>

</body>
</html>
